name: Convert TS to MP4 from Release

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'GitHub Release URL (例: https://github.com/owner/repo/releases/tag/v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      # Gitリポジトリを初期化するためにチェックアウトを追加
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Parse Release URL
        id: parse_url
        run: |
          URL="${{ inputs.release_url }}"
          if [[ $URL =~ https://github.com/([^/]+)/([^/]+)/releases/tag/(.+) ]]; then
            REPO="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            TAG="${BASH_REMATCH[3]}"
            echo "target_repo=$REPO" >> "$GITHUB_OUTPUT"
            echo "target_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Target Repo: $REPO"
            echo "Target Tag: $TAG"
          else
            echo "::error::ReleaseのURL形式が正しくありません (形式: https://github.com/<owner>/<repo>/releases/tag/<tag>)"
            exit 1
          fi

      - name: Create Target Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ steps.parse_url.outputs.target_tag }}"
          NEW_TAG="mp4-${TARGET_TAG}-$(date +%Y%m%d%H%M%S)"

          echo "アップロード先の新規Release ($NEW_TAG) を作成します..."
          # --repo と --target を明示してReleaseを作成
          gh release create "$NEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "Converted MP4 (${TARGET_TAG})" \
            --notes "元Release: ${{ inputs.release_url }} から変換されたmp4ファイルです。"

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Process Files (Download -> Convert -> Upload -> Delete)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ steps.parse_url.outputs.target_repo }}"
          SRC_TAG="${{ steps.parse_url.outputs.target_tag }}"
          DEST_TAG="${{ steps.create_release.outputs.new_tag }}"

          # 元Release内の .ts ファイル一覧を取得
          ts_files=$(gh release view "$SRC_TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name | endswith(".ts")) | .name')

          if [ -z "$ts_files" ]; then
            echo "::warning::.ts ファイルが見つかりませんでした。"
            exit 0
          fi

          # 1ファイルずつループ処理
          while IFS= read -r filename; do
            [ -z "$filename" ] && continue
            echo "=========================================="
            echo "開始: $filename"

            # 1. 1ファイルのみダウンロード
            gh release download "$SRC_TAG" --repo "$REPO" --pattern "$filename" --dir .

            # 出力ファイル名 (.ts -> .mp4)
            basename_no_ext="${filename%.*}"
            mp4_file="${basename_no_ext}.mp4"

            # 2. mp4に変換 (無劣化・高速)
            echo "変換中: $filename -> $mp4_file"
            ffmpeg -i "$filename" -c copy "$mp4_file"

            # 3. 先に作成したReleaseへアップロード
            echo "アップロード中: $mp4_file"
            gh release upload "$DEST_TAG" "$mp4_file" --repo "$GITHUB_REPOSITORY"

            # 4. ディスク容量解放（元のtsと変換したmp4を即座に削除）
            rm -f "$filename" "$mp4_file"
            echo "クリーンアップ完了: $filename, $mp4_file"
          done <<< "$ts_files"

          echo "=========================================="
          echo "すべてのファイルの変換とアップロードが完了しました。"
